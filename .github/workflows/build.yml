name: Build weather overlays

on:
  schedule:
    # AROME runs every 3 h, ARPEGE every 6 h; both are complete ~4 h later.
    # Every 3 h also means a skipped scheduled run (GitHub drops some under
    # load) only leaves the data 3 h older, not 6.
    - cron: "40 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
